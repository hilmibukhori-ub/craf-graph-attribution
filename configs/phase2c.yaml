# Phase 2C: final synthetic validation (population inference; unit = simulated instance).
# Frozen (scripts/freeze_plan.py) BEFORE any pool instance with master_seed 20261215 exists.
# DGP effect sizes come from the dev-seed-999 calibration recorded in docs/phase2c_protocol.md.
name: phase2c
master_seed: 20261215
model: sgc_ridge
draws: 2
swap_factor: 5.0
chunk: 120
attrs: [block, w1, w2, w3, w4, w5, w6, w7, w8]   # K = 48 candidates in the pool
out_dir: outputs/phase2c
scenarios:
  S7_hard: 14400
  S7_easy: 14400
  S8_small_hard: 7200
  S8_large_hard: 7200
  S8_small_easy: 7200
  S8_large_easy: 7200
analysis:
  alpha: 0.05
  alpha1: 0.01               # interim (stage-1) efficacy level; alpha2 = alpha - alpha1
  eps: [0.005, 0.0]          # primary first
  block: 120                 # instances per independent experiment
  r_dev: 20
  n_conf_max: 100
  top_m: 2
  search_frac: 0.3333333333
  hit_tol: 0.002
  d_floor: 0.003
  audit_boot: 20000
  k_configs:
    - {name: K18, attrs: [block, w1, w2, w3, w4], budgets: [6, 9, 12, 24]}
    - {name: K48, attrs: [block, w1, w2, w3, w4, w5, w6, w7, w8], budgets: [6, 12, 24]}
